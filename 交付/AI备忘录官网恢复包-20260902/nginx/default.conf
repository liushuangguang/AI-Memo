server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /app-release.apk {
        return 302 /h5/app-release.apk;
    }

    location = /home {
        try_files /home.html =404;
    }

    location = /products {
        try_files /product.html =404;
    }

    location = /support {
        try_files /support.html =404;
    }

    location = /download {
        try_files /download.html =404;
    }

    location ~* ^/h5/app-release\.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="AI-Note.apk"';
        add_header Cache-Control 'no-cache';
        try_files $uri =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|ttf|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control 'public, immutable';
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
}
