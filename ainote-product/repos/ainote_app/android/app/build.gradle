plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// release
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

// debug
def keystorePropertiesFileDev = rootProject.file("key_dev.properties")
def keystorePropertiesDev = new Properties()
if (keystorePropertiesFileDev.exists()) {
    keystorePropertiesFileDev.withReader('UTF-8') { reader ->
        keystorePropertiesDev.load(reader)
    }
}

// Flutter forwards --dart-define values as base64 encoded key/value pairs.
// Mirror only the two capture values that native background work must know;
// runtime code still validates the endpoint against a narrow allowlist.
def dartDefines = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').split(',').each { encoded ->
        try {
            def decoded = new String(encoded.decodeBase64(), 'UTF-8')
            def separator = decoded.indexOf('=')
            if (separator > 0) {
                dartDefines[decoded.substring(0, separator)] = decoded.substring(separator + 1)
            }
        } catch (ignored) {
            // Invalid unrelated dart-defines must not make Android configuration fail.
        }
    }
}
def nativeGuestMode = (dartDefines['GUEST_MODE'] ?: 'true').toBoolean()
def nativeApiBaseUrl = dartDefines['API_BASE_URL'] ?: 'https://aifunc.top'
def nativeApiBaseUrlLiteral = groovy.json.JsonOutput.toJson(nativeApiBaseUrl)


android {
    namespace = "aifunc.top.ainote_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "aifunc.top.ainote_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        buildConfigField "boolean", "GUEST_MODE", nativeGuestMode.toString()
        buildConfigField "String", "API_BASE_URL", nativeApiBaseUrlLiteral
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }

        debug {
            keyAlias keystorePropertiesDev['keyAlias']
            keyPassword keystorePropertiesDev['keyPassword']
            storeFile keystorePropertiesDev['storeFile'] ? file(keystorePropertiesDev['storeFile']) : null
            storePassword keystorePropertiesDev['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true
            shrinkResources true
        }
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
    }

    // 配置输出文件名
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def versionName = variant.versionName
            def versionCode = variant.versionCode
            def flavorName = variant.flavorName
            def buildType = variant.buildType.name
            def createTime = new Date().format("yyyy_MM_dd_HH_mm_ss")

            def fileName = "${applicationId}-${flavorName}-${createTime}-${buildType}-v${versionName}-${versionCode}.apk"

            output.outputFileName = fileName
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
