name: ainote_app
description: "ai note app"
publish_to: 'none'
version: 0.1.5+7

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_screenutil: ^5.9.3
  flutter_phoenix: ^1.1.1
  logger: ^2.4.0
  dio: ^5.7.0
  http_mock_adapter: ^0.6.1
  flutter_launcher_icons: ^0.14.1
  change_app_package_name: ^1.4.0
  rename_app: ^1.6.1
  flutter_svg: ^2.0.10+1
  dio_cache_interceptor: ^3.5.0
  dio_smart_retry: ^7.0.1
  path_provider: ^2.1.4
  intl: ^0.20.1
  uuid: ^4.5.1
  flutter_secure_storage: ^9.2.2
  board_datetime_picker: ^2.1.4
  modal_bottom_sheet: ^3.0.0
  webview_flutter: ^4.10.0
  flutter_smart_dialog: ^4.9.8+3
  flutter_animate: ^4.5.0
  loading_animation_widget: ^1.3.0
  markdown_quill: ^4.2.0
  share_plus: ^10.1.0
  cached_network_image: ^3.4.1
  desktop_drop: ^0.5.0
  image_cropper: ^8.0.2
  google_fonts: ^6.2.1
  flutter_quill: ^10.8.5
  flutter_quill_extensions: ^10.8.5
  path: ^1.9.0
  audioplayers: ^6.1.0
  vibration: ^2.0.1
  simple_gradient_text: ^1.3.0
  loading_more_list: ^7.1.0
  marquee: ^2.3.0
  dropdown_search: ^6.0.1
  auto_size_text: ^3.0.0
  json_serializable: ^6.8.0
  #  issue see here: https://github.com/MisterJimson/flutter_keyboard_visibility/pull/159#issuecomment-2379671947
  flutter_keyboard_visibility_temp_fork: ^0.1.1
  flash_card: ^0.1.0
  card_swiper: ^3.0.1
  skeletonizer: ^2.1.3
  expandable: ^5.0.1
  flutter_markdown: ^0.7.4+1
  toastification: ^2.3.0
  markdown: ^7.2.2
  animate_do: ^3.3.4
  loading_indicator: ^3.1.1
  phone_form_field: ^10.0.2
  get_storage: ^2.1.1
  flutter_statusbarcolor_ns: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.7
  build_runner: ^2.4.13

dependency_overrides:
  intl: ^0.20.1
  # CargoKit 0.8.x looks for Flutter's pre-3.29 Gradle plugin class name and
  # silently skips the Android native build on current Flutter versions.
  super_clipboard: ^0.9.1
  super_native_extensions: ^0.9.1
  flutter_quill_delta_from_html: ^1.1.5
  markdown_quill: ^4.2.0
  device_info_plus: ^11.1.0
  flutter_quill: ^10.8.5
  flutter_quill_extensions: ^10.8.5

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/edit_tool_bar/
    - assets/images/home_bottom_icon/
    - assets/sounds/
    - assets/images/login/

flutter_assets_generator:
  output_dir: generated
  auto_detection: true
  named_with_parent: true
  output_filename: assets
  class_name: Assets
  filename_split_pattern: "[-_]"
  # Optional. Configuring ignore paths. Default: [],e.g: ["assets/fonts", "assets/images/dark", ...]
  path_ignore: [ ]
