# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    client_max_body_size 10M;


    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name aifunc.top www.aifunc.top;

        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

	    # 处理根路径，重定向到指定的静态页面
        location = / {
            proxy_pass http://127.0.0.1:8080/h5/www/home.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            # 禁用代理缓存
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        location = /app-release.apk {
            proxy_pass http://127.0.0.1:8080/h5/app-release.apk;
        }

        location /static/ {
            proxy_pass http://127.0.0.1:8080/h5/www/static/;
        }

	    location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
	   }
    }

    # HTTPS 服务器配置
    server {
        listen 443 ssl;
        server_name aifunc.top www.aifunc.top;

        ssl_certificate /etc/ssl/certs/aifunc.top/fullchain.pem;
        ssl_certificate_key /etc/ssl/private/aifunc.top/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'HIGH:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK';
        # 处理根路径，重定向到指定的静态页面
        location = / {
            proxy_pass http://127.0.0.1:8080/h5/www/home.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            # 禁用代理缓存
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        location = /app-release.apk {
            proxy_pass http://127.0.0.1:8080/h5/app-release.apk;
        }

        location /static/ {
            proxy_pass http://127.0.0.1:8080/h5/www/static/;
        }

	    location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

}
